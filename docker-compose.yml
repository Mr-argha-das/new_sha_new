version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: rhhc-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: rhhc_invoice
      MYSQL_USER: rhhc_user
      MYSQL_PASSWORD: rhhc_password123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./rhhc_invoice.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - rhhc-network

  backend:
    build:
      context: ./backend_invoice_management_RHHC-main/backend_invoice_management_RHHC-main
      dockerfile: Dockerfile
    container_name: rhhc-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_USER: rhhc_user
      DB_PASSWORD: rhhc_password123
      DB_NAME: rhhc_invoice
      JWT_SECRET: your-super-secret-jwt-key-change-this
      REFRESH_SECRET: your-super-secret-refresh-key-change-this
      JWT_EXPIRES_IN: 7d
      NODE_ENV: production
    depends_on:
      - mysql
    volumes:
      - backend_uploads:/app/src/uploads
    networks:
      - rhhc-network

  frontend:
    build:
      context: ./frontend_invoice_management_RHHC-main/frontend_invoice_management_RHHC-main
      dockerfile: Dockerfile
    container_name: rhhc-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
      NODE_ENV: production
    depends_on:
      - backend
    networks:
      - rhhc-network

  nginx:
    image: nginx:alpine
    container_name: rhhc-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx-docker.conf:/etc/nginx/conf.d/default.conf
      - ./deploy/ssl:/etc/nginx/ssl
    depends_on:
      - frontend
      - backend
    networks:
      - rhhc-network

volumes:
  mysql_data:
  backend_uploads:

networks:
  rhhc-network:
    driver: bridge
